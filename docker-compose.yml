# Default (SQLite):   docker compose up --build
# With PostgreSQL:    DB_TYPE=postgres docker compose --profile postgres up --build
# INGEST_API_KEYS, ADMIN_PASSWORD and SESSION_SECRET must be set in .env (see sample.env).
services:
  sms-test-service:
    build: .
    image: sms-test-service:latest
    ports:
      - "${PORT:-3006}:3006"
    environment:
      INGEST_API_KEYS: ${INGEST_API_KEYS:?Set INGEST_API_KEYS in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      DB_TYPE: ${DB_TYPE:-sqlite}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-sms}
      PG_PASSWORD: ${PG_PASSWORD:-sms}
      PG_DATABASE: ${PG_DATABASE:-sms}
    volumes:
      - sms-data:/app/data
      - sms-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${PG_USER:-sms}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-sms}
      POSTGRES_DB: ${PG_DATABASE:-sms}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sms-data:
  sms-logs:
  pg-data:
